sonar.projectKey=builddoctor_pipeline-playpen
sonar.organization=simpsonjulian

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=pipeline-playpen
#sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,build/**,reports/**,zap/**

# Test coverage from jest (see jest.config.js coverageDirectory)
sonar.javascript.lcov.reportPaths=build/coverage/lcov.info

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
